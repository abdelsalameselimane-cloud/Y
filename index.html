<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة REQ</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#12151c;--mu:#6a7282;--bd:#e5e8ee;--in:#f1f3f8;--pr:#4f6bff;--pr2:#7c5cff;--ok:#15803d;--er:#dc2626;--sh:0 1px 2px rgba(18,21,28,.04),0 6px 20px rgba(18,21,28,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d12;--card:#141821;--tx:#eceef3;--mu:#9aa3b5;--bd:#262c3a;--in:#1b2030;--pr:#6580ff;--pr2:#8e74ff;--ok:#34d399;--er:#f87171;--sh:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0d12;--card:#141821;--tx:#eceef3;--mu:#9aa3b5;--bd:#262c3a;--in:#1b2030;--pr:#6580ff;--pr2:#8e74ff;--ok:#34d399;--er:#f87171;--sh:none;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Tahoma,Roboto,"Noto Sans Arabic",Arial,sans-serif;direction:ltr;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.t{unicode-bidi:plaintext;text-align:start}.ltr{direction:ltr;unicode-bidi:isolate}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;gap:14px;padding:20px 0}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--pr),var(--pr2));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:26px;height:26px}
.grow{flex:1;min-width:0}
h1{margin:0;font-size:18.4px;line-height:1.4}
.mu{color:var(--mu)}.sm{font-size:13.6px}.xs{font-size:12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:14px}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--pr)) 13%,transparent);color:var(--c,var(--pr))}
.card h2{margin:0;font-size:16.8px;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:700;width:100%;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(.97)}
.btn.p{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0}.btn.p:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--mu);flex:none}
.ib:hover{background:var(--in);color:var(--tx)}
.chip{min-height:36px;padding:0 16px;border-radius:50px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13.6px}
.chip.on{background:color-mix(in srgb,var(--pr) 13%,transparent);border-color:var(--pr);color:var(--pr);font-weight:700}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:10px;background:var(--in);border:1px solid var(--bd);border-radius:13px;padding:0 14px;min-height:48px}
.field:focus-within{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 20%,transparent)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:0;min-height:44px;unicode-bidi:plaintext}
.ban{display:flex;gap:14px;align-items:flex-start;border-radius:16px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent)}
.ban>svg{color:var(--c);margin-top:2px}.ban b{display:block;line-height:1.5}.ban .btn{margin-top:10px;width:auto;min-height:40px}
.spin{width:20px;height:20px;border:2.5px solid color-mix(in srgb,var(--pr) 25%,transparent);border-top-color:var(--pr);border-radius:50%;animation:sp .8s linear infinite;flex:none;margin-top:2px}
.btn .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff;margin:0}
@keyframes sp{to{transform:rotate(360deg)}}
.stack{display:flex;flex-direction:column;gap:14px}
.home{display:grid;gap:16px;max-width:680px;margin:0 auto}
.drop{margin-top:18px;border:2px dashed var(--bd);border-radius:16px;padding:22px 16px;text-align:center;color:var(--mu);transition:.15s}
.drop.over{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 8%,transparent);color:var(--pr)}
.drop .btn{margin-top:12px}
.lastc{cursor:pointer}.lastc:hover{border-color:var(--pr)}
.big{font-size:34px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
hr{border:0;height:1px;background:var(--bd);margin:16px 0;width:100%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:16.8px}
.res{display:grid;gap:16px;align-items:start}
.side{display:flex;flex-direction:column;gap:14px}
.list{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.ent .eq{font-weight:700;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:700;padding:2px 10px;border-radius:50px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(10,12,18,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fi .15s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto;animation:su .2s}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(30px);opacity:0}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.raw{max-height:120px;overflow:auto;background:var(--in);border:1px solid var(--bd);border-radius:13px;padding:10px;font:12px/18px ui-monospace,Consolas,monospace;color:var(--mu);white-space:pre-wrap;margin:0}
.lang{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:8px 14px;border-radius:13px;border:1px solid var(--bd);background:transparent;cursor:pointer;width:100%;text-align:start}
.lang.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:50px;z-index:30;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{text-align:center;grid-column:1/-1}
@media (min-width:720px){
 .wrap{padding:0 32px 56px}header{padding:28px 0}h1{font-size:22px}
 .ov{align-items:center}.sheet{border-radius:24px;padding:26px}
 .card{padding:22px}.big{font-size:40px}
}
@media (min-width:980px){
 .home{grid-template-columns:1.25fr 1fr;max-width:none;align-items:start}.home .full{grid-column:1/-1}
 .home.solo{grid-template-columns:1fr;max-width:680px}
 .res{grid-template-columns:360px 1fr;gap:24px}
 .side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
 .tools{display:flex;gap:12px;align-items:center}.tools .field{flex:1}
}
@media (max-width:979px){.tools .chips{margin-top:10px}}
</style>
</head>

أربعة."}};
const LANGS=[["ar","العربية"],["en","English"],["fr","Français"]];
// ── Engine (port of Engine.kt) ──
const SEP='\\s*[-–—,;|]\\s*';
const R={ESC:/\x1B\[[0-9;]*[A-Za-z]|\x1B[()][0-9A-Za-z]|\x1B[A-Za-z]\d*|[\x00-\x08\x0B\x0C\x0E-\x1F]/g,REQ:/REQ\s*:\s*([\d.,]+)/,
FOUR:new RegExp('^\\s*(\\d+)'+SEP+'(\\d+)'+SEP+'(\\d+)'+SEP+'(\\d+)\\s*$'),ANY:new RegExp('^\\s*\\d+('+SEP+'\\d+)+\\s*$'),
HEADER:/^\s*(\d+)\s+\d\d\/\d\d\/\d\d/,TIME:/^\s*(\d\d:\d\d:\d\d)\s+[A-Z ]+?\s*$/,RC:/\bRC\s+(\d{3})\b/,NP:/NOTES PRESENTED ([\d,]+)/};
const sum=a=>a.reduce((x,y)=>x+y,0);
function clean(t){return t.replace(R.ESC,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c))}
function parse(input){
 const l=clean(input).split('\n'),idx=[];l.forEach((s,i)=>{if(R.REQ.test(s))idx.push(i)});
 const seen=new Set(),out=[];
 idx.forEach((i,k)=>{
  const end=Math.min(k+1<idx.length?idx[k+1]:l.length,i+14);
  let ref='REQ '+String(k+1).padStart(3,'0'),time='';
  for(let j=i-1;j>=Math.max(0,i-4);j--){const h=R.HEADER.exec(l[j]);if(h){ref=h[1];break}const t=R.TIME.exec(l[j]);if(t)time=t[1]}
  let a=Number(R.REQ.exec(l[i])[1].replace(/,/g,'').replace(/\.+$/,''));if(isNaN(a))a=0;
  let nums=[],bad='';
  for(let j=i+1;j<Math.min(end,i+4);j++){if(!l[j].trim())continue;const m=R.FOUR.exec(l[j]);
   if(m)nums=m.slice(1,5).map(Number);else if(R.ANY.test(l[j]))bad=l[j].trim();break}
  const raw=l.slice(i,end).join('\n').trim(),rc=(R.RC.exec(raw)||[])[1];
  let status,note='',code='',arg='';
  if(nums.length==4){status='VALID';const np=R.NP.exec(raw);
   if(np&&sum(np[1].split(',').map(x=>parseInt(x)||0))!=sum(nums)){status='VERIFY';note='Sum differs from NOTES PRESENTED';code='SUM'}}
  else if(bad){status='VERIFY';note='Expected 4 numbers: '+bad;code='BAD';arg=bad}
  else if(a==0||rc){status='NO_DISPENSE';note=rc?'Declined RC '+rc:'No cash';code=rc?'DECLINED':'NOCASH';arg=rc||''}
  else{status='VERIFY';note='REQ > 0 but no four-number line';code='NOLINE'}
  const key=[ref,time,a,nums.join('-')].join('|');
  if(!seen.has(key)){seen.add(key);out.push({ref,time,req:a,numbers:nums,total:sum(nums),status,note,raw,code,arg})}
 });return out}
const summarize=e=>({detected:e.length,valid:e.filter(x=>x.status=='VALID').length,verify:e.filter(x=>x.status=='VERIFY').length,noDispense:e.filter(x=>x.status=='NO_DISPENSE').length,grand:sum(e.filter(x=>x.status=='VALID').map(x=>x.total))});
const edit=(e,n)=>({...e,numbers:n,total:sum(n),status:n.length==4?'VALID':'VERIFY',note:'Edited',code:'EDITED',arg:''});
function noteText(x,lang){if(lang=='en')return x.note;return({SUM:'La somme diffère de NOTES PRESENTED',BAD:'Quatre nombres attendus : '+x.arg,DECLINED:'Refusé RC '+x.arg,NOCASH:'Aucun retrait',NOLINE:'REQ > 0 mais aucune ligne de quatre nombres',EDITED:'Modifié'})[x.code]||x.note}
function toCsv(e,lang){const fr=lang!='en';
 let s='\uFEFF'+(fr?'Réf,Heure,REQ,N1,N2,N3,N4,Total,Statut,Note':'Ref,Time,REQ,N1,N2,N3,N4,Total,Status,Note')+'\n';
 for(const x of e){const st=!fr?x.status:({VALID:'VALIDE',NO_DISPENSE:'SANS DISTRIBUTION',VERIFY:'À VÉRIFIER'})[x.status];
  const rq=Number.isInteger(x.req)?x.req.toFixed(1):String(x.req);
  s+=[x.ref,x.time,rq,...[0,1,2,3].map(i=>x.numbers[i]??''),x.total,st].join(',')+',"'+noteText(x,lang).replace(/"/g,'""')+'"\n'}
 return s+(fr?'TOTAL GÉNÉRAL':'GRAND TOTAL')+',,,,,,,'+summarize(e).grand+',,\n'}

Alert:["M12 3L2.5 20h19L12 3z","M12 10v4","M12 17.2v.01"],Ban:["M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z","M5.6 5.6l12.8 12.8"],File:["M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z","M14 3v5h5","M9 13h6","M9 17h4"],
Table:["M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z","M4 10h16","M4 15h16","M10 4v16"],
Calc:["M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z","M8 7.5h8","M8.5 12h.01","M12 12h.01","M15.5 12h.01","M8.5 16h.01","M12 16h.01","M15.5 16h.01"]};
const ic=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+P[n].map(d=>'<path d="'+d+'"/>').join('')+'</svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const num=n=>n.toLocaleString('en-US'),amt=d=>d.toLocaleString('en-US',{maximumFractionDigits:2});
let LS=null;try{LS=window.localStorage}catch(e){}
const sget=k=>{try{return LS&&LS.getItem(k)}catch(e){return null}},sset=(k,v)=>{try{LS&&LS.setItem(k,v)}catch(e){}};
function loadEntries(){try{const a=JSON.parse(sget('entries')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
const detect=()=>{const l=(navigator.language||'ar').slice(0,2);return D[l]?l:'ar'};
// ── state ──
const S={entries:loadEntries(),screen:0,q:'',onlyV:false,csvLang:'fr',lang:sget('lang')||detect(),busy:false,saving:false,homeErr:null,saveErr:false,excelErr:false,sheet:null,idx:0};
const t=(k,a)=>{let s=D[S.lang][k]??D.en[k]??k;for(const x in a||{})s=s.replace('{'+x+'}',a[x]);return s};
const $=s=>document.querySelector(s);
function persist(){sset('entries',JSON.stringify(S.entries))}
let tt;function toast(k){const el=$('#toast');el.innerHTML='<div class="toast t" role="status">'+esc(t(k))+'</div>';clearTimeout(tt);tt=setTimeout(()=>el.innerHTML='',2400)}
function banner(kind,title,desc,act){const c={RUN:'var(--pr)',ERR:'var(--er)',OK:'var(--ok)'}[kind];
 return '<div class="ban" style="--c:'+c+'" role="'+(kind=='ERR'?'alert':'status')+'">'+(kind=='RUN'?'<div class="spin"></div>':ic(kind=='OK'?'CheckCircle':'Alert'))+'<div class="grow t"><b>'+esc(title)+'</b>'+(desc?'<span class="mu sm">'+esc(desc)+'</span>':'')+(act||'')+'</div></div>'}
const btn=(a,label,o={})=>'<button class="btn '+(o.p?'p':'')+'" data-a="'+a+'"'+(o.dis?' disabled':'')+'>'+(o.load?'<span class="spin"></span>':o.icon?ic(o.icon):'')+'<span class="t">'+esc(label)+'</span></button>';
const copyBtn=v=>'<button class="ib" data-a="copy" data-v="'+v+'" title="'+esc(t('copy_total'))+'" aria-label="'+esc(t('copy_total'))+'">'+ic('Copy')+'</button>';
// ── views ──
function header(){const back=S.screen==1&&S.entries.length;
 return '<header>'+(back?'<button class="ib" data-a="back" aria-label="'+esc(t('back'))+'" title="'+esc(t('back'))+'">'+ic('Back')+'</button>':'')+'<div class="logo">'+ic('Calc')+'</div><div class="grow"><h1 class="t">'+esc(back?t('results'):t('name'))+'</h1><div class="mu sm t">'+esc(t('tagline'))+'</div></div><button class="ib" data-a="lang" aria-label="'+esc(t('language'))+'" title="'+esc(t('language'))+'">'+ic('Globe')+'</button></header>'}
function home(){const has=S.entries.length;let h='<div class="home'+(has&&!S.busy?'':' solo')+'">';
 if(S.busy)h+='<div class="full">'+banner('RUN',t('reading'),t('reading_desc'))+'</div>';
 else if(S.homeErr)h+='<div class="full">'+banner('ERR',t('err_'+S.homeErr),t('err_'+S.homeErr+'_desc'),btn('pick',t('try_again')))+'</div>';
 h+='<div class="card"><div class="row"><div class="tile">'+ic('Upload')+'</div><div class="grow t"><h2>'+esc(t('import_title'))+'</h2><div class="mu sm">'+esc(t('import_desc'))+'</div></div></div>'+
 '<div class="drop t" id="drop">'+esc(t('drop'))+btn('pick',t('choose_file'),{p:1,icon:'Upload',dis:S.busy,load:S.busy})+'</div></div>';
 if(has&&!S.busy)h+='<div class="card lastc row" data-a="last" tabindex="0" role="button"><div class="tile">'+ic('File')+'</div><div class="grow t"><b>'+esc(t('last_title'))+'</b><div class="mu sm">'+esc(t('last_desc',{n:S.entries.length,t:num(summarize(S.entries).grand)}))+'</div></div><span class="mu">'+ic('Chevron')+'</span></div>';
 return h+'</div>'}
function results(){const s=summarize(S.entries),st=(n,l,c)=>'<div><b style="color:'+c+'">'+n+'</b><span class="xs mu t">'+esc(l)+'</span></div>';
 return '<div class="res"><aside class="side"><div class="card"><div class="row"><div class="grow t"><div class="mu sm">'+esc(t('grand'))+'</div><div class="big ltr">'+num(s.grand)+'</div><div class="mu sm">'+esc(t('grand_desc'))+'</div></div>'+copyBtn(s.grand)+'</div><hr>'+
 '<div class="stats">'+st(s.detected,t('detected'),'var(--tx)')+st(s.valid,t('valid'),'var(--ok)')+st(s.verify,t('verify'),s.verify?'var(--er)':'var(--mu)')+st(s.noDispense,t('no_dispense'),'var(--mu)')+'</div>'+
 '<div class="mu sm t" style="margin-top:20px">'+esc(t('csv_lang'))+'</div><div class="chips" style="margin:6px 0 14px">'+['fr','en'].map(c=>'<button class="chip '+(S.csvLang==c?'on':'')+'" data-a="csv" data-v="'+c+'">'+esc(t('lang_'+c))+'</button>').join('')+'</div>'+
 '<div class="stack" style="gap:10px">'+btn('export',S.saving?t('exporting'):t('export_csv'),{p:1,icon:'Download',dis:S.saving,load:S.saving})+btn('excel',t('open_excel'),{icon:'Table',dis:S.saving})+'</div></div>'+
 (S.saveErr?banner('ERR',t('err_save'),t('err_save_desc'),btn('export',t('try_again'))):'')+(S.excelErr?banner('ERR',t('err_excel'),t('err_excel_desc')):'')+
 (s.verify?banner('ERR',t('verify_banner',{n:s.verify}),t('verify_banner_desc')):banner('OK',t('all_ok'),t('all_ok_desc')))+'</aside>'+
 '<main class="stack"><div class="tools"><label class="field">'+ic('Search')+'<input id="q" type="search" value="'+esc(S.q)+'" placeholder="'+esc(t('search'))+'" aria-label="'+esc(t('search'))+'"></label><div class="chips" id="flt"></div></div><div class="list" id="list"></div></main></div>'}
function filters(){$('#flt').innerHTML=[[0,'f_all'],[1,'f_verify']].map(([v,k])=>'<button class="chip '+((S.onlyV?1:0)==v?'on':'')+'" data-a="flt" data-v="'+v+'">'+esc(t(k))+'</button>').join('')}
function entry(e,i){const col={VALID:'var(--ok)',VERIFY:'var(--er)',NO_DISPENSE:'var(--mu)'}[e.status],icn={VALID:'CheckCircle',VERIFY:'Alert',NO_DISPENSE:'Ban'}[e.status];
 const title=/^\d+$/.test(e.ref)?'#'+e.ref:e.ref,sub=[e.time,'REQ '+amt(e.req)].filter(Boolean).join(' · '),four=e.numbers.length==4;
 return '<article class="card ent" style="--c:'+col+'"><div class="row"><div class="tile">'+ic(icn)+'</div><div class="grow"><b class="ltr">'+esc(title)+'</b><div class="mu sm ltr">'+esc(sub)+'</div></div><span class="badge t">'+esc(t('st_'+e.status))+'</span></div>'+
 (four?'<div class="row" style="margin-top:14px;gap:10px"><div class="grow eq ltr">'+e.numbers.join(' + ')+' = '+num(e.total)+'</div>'+copyBtn(e.total)+'<button class="ib" data-a="edit" data-i="'+i+'" title="'+esc(t('edit'))+'" aria-label="'+esc(t('edit'))+'">'+ic('Edit')+'</button></div>':'')+
 (e.code?'<div class="sm t" style="margin-top:6px;color:'+(e.status=='VERIFY'?'var(--er)':'var(--mu)')+'">'+esc(t('n_'+e.code,{a:e.arg}))+'</div>':'')+
 (!four&&e.status=='VERIFY'?'<div style="margin-top:14px">'+btn('edit',t('edit'),{icon:'Edit'}).replace('data-a="edit"','data-a="edit" data-i="'+i+'"')+'</div>':'')+'</article>'}
function list(){const q=S.q.trim(),sh=S.entries.map((e,i)=>[e,i]).filter(([e])=>(!q||e.ref.includes(q)||e.time.includes(q)||String(e.total)==q)&&(!S.onlyV||e.status=='VERIFY'));
 $('#list').innerHTML=sh.length?sh.map(([e,i])=>entry(e,i)).join(''):'<div class="card empty t"><p class="mu" style="margin-top:0">'+esc(t('empty_filter'))+'</p>'+btn('clear',t('clear_filters'))+'</div>'}
function render(){document.documentElement.lang=S.lang;document.title=t('name');
 $('#app').innerHTML=header()+(S.screen==1&&S.entries.length?results():home());
 if(S.screen==1&&S.entries.length){filters();list()}
 const L=$('#layer');
 if(S.sheet=='lang')L.innerHTML='<div class="ov" data-a="close"><div class="sheet" role="dialog" aria-modal="true"><h2 class="t" style="margin:0">'+esc(t('language'))+'</h2>'+LANGS.map(([c,n])=>'<button class="lang '+(c==S.lang?'on':'')+'" data-a="setlang" data-v="'+c+'"><span>'+n+'</span>'+(c==S.lang?ic('Check'):'')+'</button>').join('')+'</div></div>';
 else if(S.sheet=='edit'&&S.entries[S.idx]){const e=S.entries[S.idx];
  L.innerHTML='<div class="ov" data-a="close"><div class="sheet" role="dialog" aria-modal="true"><h2 class="t" style="margin:0">'+esc(t('edit_title'))+'</h2><div class="mu sm t">'+esc(t('edit_desc'))+'</div><div class="g2">'+
  [0,1,2,3].map(i=>'<label><span class="mu sm t">'+esc(t('note_n',{n:i+1}))+'</span><div class="field"><input class="n" inputmode="numeric" maxlength="7" placeholder="0" value="'+(e.numbers[i]??'')+'"></div></label>').join('')+
  '</div><div class="sm t" id="err" style="color:var(--er)" hidden>'+esc(t('err_edit'))+'</div><div class="mu sm t">'+esc(t('original'))+'</div><pre class="raw ltr">'+esc(e.raw)+'</pre><div class="g2">'+btn('close',t('cancel'))+btn('save',t('save'),{p:1})+'</div></div></div>';
  const f=L.querySelector('.n');f&&f.focus()}
 else L.innerHTML=''}
// ── actions ──
async function readFile(f){S.busy=true;S.homeErr=null;S.screen=0;render();let p=null;
 try{const b=new Uint8Array(await f.arrayBuffer());let s='';for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));p=parse(s)}catch(e){p=null}
 S.busy=false;
 if(!p)S.homeErr='open';else if(!p.length)S.homeErr='none';else{S.entries=p;S.q='';S.onlyV=false;S.saveErr=false;persist();go(1);return}
 render()}
function go(n){S.screen=n;if(n==1){if(location.hash!='#results')location.hash='results'}else if(location.hash)history.replaceState(null,'',location.pathname+location.search);render();window.scrollTo(0,0)}
async function save(){S.saving=true;S.saveErr=false;S.excelErr=false;render();
 const data=new Blob([toCsv(S.entries,S.csvLang)],{type:'text/csv;charset=utf-8'});let ok=false;
 try{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download='REQ_report.csv';document.body.appendChild(a);a.click();a.remove();ok=true}catch(e){}
 S.saving=false;if(!ok)S.saveErr=true;render();if(ok)toast('saved')}
async function copy(v,b){let ok=false;try{await navigator.clipboard.writeText(v);ok=true}catch(e){try{const x=document.createElement('textarea');x.value=v;document.body.appendChild(x);x.select();ok=document.execCommand('copy');x.remove()}catch(e2){}}
 if(ok){const h=b.innerHTML;b.innerHTML=ic('Check');b.style.color='var(--ok)';setTimeout(()=>{b.innerHTML=h;b.style.color=''},1400)}}
function saveEdit(){const v=[...document.querySelectorAll('#layer .n')].map(i=>i.value.trim());
 if(v.some(x=>!/^\d+$/.test(x))){$('#err').hidden=false;return}
 S.entries[S.idx]=edit(S.entries[S.idx],v.map(Number));persist();S.sheet=null;render();toast('updated')}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
 if(a=='close'&&el.classList.contains('ov')&&ev.target!==el)return;
 if(a=='pick')$('#file').click();else if(a=='last')go(1);else if(a=='back')go(0);else if(a=='lang'){S.sheet='lang';render()}
 else if(a=='setlang'){S.lang=el.dataset.v;sset('lang',S.lang);S.sheet=null;render()}
 else if(a=='close'){S.sheet=null;render()}else if(a=='csv'){S.csvLang=el.dataset.v;render()}
 else if(a=='flt'){S.onlyV=el.dataset.v=='1';filters();list()}else if(a=='clear'){S.q='';S.onlyV=false;render()}
 else if(a=='edit'){S.idx=+el.dataset.i;S.sheet='edit';render()}else if(a=='save')saveEdit();
 else if(a=='export'||a=='excel')save();else if(a=='copy')copy(el.dataset.v,el)});
document.addEventListener('input',ev=>{const el=ev.target;
 if(el.id=='q'){S.q=el.value;list()}else if(el.classList.contains('n')){el.value=el.value.replace(/\D/g,'').slice(0,7);const e=$('#err');e&&(e.hidden=true)}});
document.addEventListener('keydown',ev=>{if(ev.key=='Escape'&&S.sheet){S.sheet=null;render()}
 else if(ev.key=='Enter'&&S.sheet=='edit'&&ev.target.classList.contains('n'))saveEdit();
 else if((ev.key=='Enter'||ev.key==' ')&&ev.target.dataset&&ev.target.dataset.a=='last'){ev.preventDefault();go(1)}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)readFile(f)});
['dragover','dragenter'].forEach(n=>document.addEventListener(n,e=>{if(S.screen==0&&$('#drop')){e.preventDefault();$('#drop').classList.add('over')}}));
['dragleave','drop'].forEach(n=>document.addEventListener(n,e=>{const d=$('#drop');d&&d.classList.remove('over')}));
document.addEventListener('drop',e=>{if(S.screen==0&&$('#drop')){e.preventDefault();const f=e.dataTransfer.files[0];if(f)readFile(f)}});
window.addEventListener('hashchange',()=>{const n=location.hash=='#results'&&S.entries.length?1:0;if(n!=S.screen){S.screen=n;render()}});
if(location.hash=='#results'&&S.entries.length)S.screen=1;
render();
</script>
</body>
